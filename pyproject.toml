[project]
name = "archgraph"
version = "2.1.0"
description = "Agentic Codebase Intelligence & Architectural Audit Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.35.0",
    "graphifyy>=0.1.0",
    "networkx>=3.2.1",
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-fastembed>=0.1.0",
    "fastembed>=0.3.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.30",
    "langgraph>=0.0.30",
    "langchain-groq>=0.1.0",
    "langchain-nvidia-ai-endpoints>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "markitdown>=0.1.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "streamlit-sortables>=0.3.1",
    "streamlit-tree-select>=0.0.5",
    "pytest>=8.0.0",
]

[project.scripts]
archgraph-ingest = "api.main:run_ingestion"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
